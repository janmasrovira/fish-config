# Manifest of secrets to pull from Bitwarden into
# ~/.config/fish/conf.d/secrets.fish. This file contains no secrets itself,
# only metadata (which vault item + field maps to which env var).
#
# Each entry:
#   item:  Bitwarden item name
#   field: custom field name on that item
#   env:   environment variable to export in fish
secrets: []
  # - item: Example
  #   field: api_key
  #   env: EXAMPLE_API_KEY
